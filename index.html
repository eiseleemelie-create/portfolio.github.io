/* Layout: one rotating dial. Portrait in the middle, eight wedges packed tight around it, scroll or drag to turn. */
:root{
  --cream:#FFFFE6; --paper:#FFFFF4; --ink:#111010; --grey:#6E6A63; --line:rgba(17,16,16,.14);
  --burgundy:#7A1530; --sage:#A3BE9E;
  --head:"Clash Display","Bricolage Grotesque",ui-sans-serif,system-ui,"Helvetica Neue",Arial,sans-serif;
  --text:"Clash Display","Bricolage Grotesque",ui-sans-serif,system-ui,"Helvetica Neue",Arial,sans-serif;
  --num:"Oi","Arial Black",Impact,sans-serif;
  --name:"Space Grotesk",ui-sans-serif,system-ui,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--cream);color:var(--ink);font-family:var(--text);font-weight:200;font-size:16px;line-height:1.55;overflow:hidden}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
b,strong{font-weight:700}
:focus-visible{outline:2px solid var(--burgundy);outline-offset:3px}
h1,h2,h3,h4,h5{font-family:var(--head);font-weight:700;letter-spacing:-.01em}

.top,.bottom{position:fixed;left:0;right:0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:12px;pointer-events:none;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top > *,.bottom > *{pointer-events:auto}
.top{top:0;padding-top:calc(16px + env(safe-area-inset-top,0px))}
.bottom{bottom:0;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));align-items:flex-end}
.logo{font-family:var(--head);font-weight:700;font-size:26px;line-height:1;background:none;border:0;padding:0;cursor:pointer}
.nav{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.pill{border:1px solid var(--ink);background:transparent;border-radius:999px;padding:6px 14px;font-size:13px;cursor:pointer;transition:background .2s,color .2s}
.pill:hover,.pill[aria-pressed="true"]{background:var(--ink);color:var(--cream)}
.copy{border:0;background:none;padding:0;cursor:pointer;font-size:13px;border-bottom:1px solid var(--line);text-align:left}
.hint{font-size:12px;letter-spacing:.08em;color:var(--grey)}

#wrap{position:fixed;inset:0;display:grid;place-items:center;touch-action:none;user-select:none;-webkit-user-select:none}
/* 3D film reel: frames on a slowly tilted cylinder, ABOUT ME floats in the middle */
#stage3d{position:absolute;inset:0;width:100%;height:100%;perspective:1500px;perspective-origin:50% 42%;cursor:grab;display:grid;place-items:center}
#stage3d.dragging{cursor:grabbing}
.scene{position:relative;width:var(--fw,240px);height:var(--fh,300px);transform-style:preserve-3d;transform:translateZ(calc(var(--rad,300px) * -1)) rotateX(-24deg)}
#reel{position:absolute;inset:0;transform-style:preserve-3d}
.fr{position:absolute;inset:0;background:#0d0c0c;padding:calc(var(--fw)*.13) calc(var(--fw)*.035);display:flex;flex-direction:column;cursor:pointer;
  backface-visibility:visible;outline:none;
  background-image:
    radial-gradient(circle at 50% 50%,var(--cream) 0 0,transparent 0),
    repeating-linear-gradient(90deg,transparent 0 calc(var(--fw)*.045),var(--cream) calc(var(--fw)*.045) calc(var(--fw)*.105),transparent calc(var(--fw)*.105) calc(var(--fw)*.15)),
    repeating-linear-gradient(90deg,transparent 0 calc(var(--fw)*.045),var(--cream) calc(var(--fw)*.045) calc(var(--fw)*.105),transparent calc(var(--fw)*.105) calc(var(--fw)*.15));
  background-size:100% 100%,100% calc(var(--fw)*.055),100% calc(var(--fw)*.055);
  background-position:0 0,0 calc(var(--fw)*.035),0 calc(100% - var(--fw)*.035);background-repeat:no-repeat}
.fr .pic{position:relative;flex:1;overflow:hidden;background:var(--paper)}
/* clean version: no film border, no sprockets, no edge text */
.fr{background:none!important;background-image:none!important;padding:0!important}
.fr .edge{display:none!important}
.fr .pic .pno{position:absolute;left:6%;top:6%;font-family:var(--num);color:var(--burgundy);background:var(--cream);padding:0 .35em;border-radius:2px;font-size:max(10px,calc(var(--fw)*.06));line-height:1.3;pointer-events:none}
.fr .pic img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;-webkit-user-drag:none}
.fr .pic svg{width:100%;height:100%;display:block}
.fr .edge{position:absolute;left:calc(var(--fw)*.035);right:calc(var(--fw)*.035);bottom:calc(var(--fw)*.012);display:flex;align-items:center;gap:6px;
  height:calc(var(--fw)*.03);font-family:var(--text);font-weight:400;font-size:max(8px,calc(var(--fw)*.036));letter-spacing:.14em;text-transform:uppercase;color:#E9E3C8;white-space:nowrap;overflow:hidden}
.fr .top-edge{top:calc(var(--fw)*.012);bottom:auto}
.fr .no{font-family:var(--num);color:var(--burgundy);background:var(--cream);padding:0 .35em;border-radius:2px;letter-spacing:0;line-height:1.3}
.fr .lb{overflow:hidden;text-overflow:ellipsis}
.fr .ptitle{position:absolute;left:6%;right:6%;bottom:7%;font-family:var(--text);font-weight:400;font-size:max(8px,calc(var(--fw)*.036));letter-spacing:.14em;text-transform:uppercase;color:var(--cream);text-shadow:0 1px 2px rgba(0,0,0,.55),0 0 8px rgba(0,0,0,.35);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}

/* giant ABOUT ME behind the reel: wider than the reel, so M and E show either side */
.centre{position:absolute;inset:0;z-index:0;background:none;border:0;padding:0;cursor:pointer;color:var(--ink);font-family:var(--head)}

#stage3d{z-index:1}

.cap{display:flex;align-items:center;gap:10px;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:6px 6px 6px 16px;max-width:100%;min-width:0}

.left{display:flex;flex-direction:column;gap:6px;min-width:0}

#scrim{position:fixed;inset:0;z-index:20;background:rgba(17,16,16,.35);opacity:0;pointer-events:none;transition:opacity .3s}

#sheet{position:fixed;z-index:21;top:0;right:0;bottom:0;width:min(640px,100%);background:var(--cream);overflow-y:auto;overscroll-behavior:contain;
  transform:translateX(102%);transition:transform .45s cubic-bezier(.2,.8,.2,1);border-left:1px solid var(--ink)}
#sheet.on{transform:none}
.sheet-in{padding-block:calc(18px + env(safe-area-inset-top,0px)) calc(48px + env(safe-area-inset-bottom,0px));
  padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}
.sheet-bar{display:flex;justify-content:space-between;align-items:center}
.close{width:40px;height:40px;border-radius:50%;border:1px solid var(--ink);background:transparent;cursor:pointer;font-size:20px;line-height:1}
.kicker{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--grey)}
.kicker b{color:var(--burgundy);font-family:var(--num);font-weight:400;font-size:1.25em;letter-spacing:0}
#sheet h2{font-size:clamp(44px,9vw,74px);line-height:.92;margin:0;text-wrap:balance}
#sheet .sub{font-size:17px;margin:0;max-width:52ch;color:var(--grey)}
.art{position:relative;width:100%;aspect-ratio:5/4;display:block;background:var(--ink)}
.art.tall{aspect-ratio:4/5}
.art img{width:100%;height:100%;object-fit:cover;display:block}
.art img.bw{filter:grayscale(1) contrast(1.05)}
.art .tools{position:absolute;left:12px;bottom:12px;display:flex;gap:8px;flex-wrap:wrap}
.body p{margin:0 0 14px;max-width:60ch;font-size:16px}
.gal{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.gal figure{margin:0;position:relative;min-width:0}
.gal figure:first-child:nth-last-child(odd),.gal figure.wide{grid-column:1/-1}
.gal video{display:block;width:100%;max-height:520px;background:var(--ink)}
.gal img{display:block;width:100%;height:100%;max-height:520px;object-fit:cover;cursor:zoom-in;background:var(--paper)}
.gal .gtools{position:absolute;right:8px;top:8px;display:flex;gap:6px}
.gal .gtools button{border:0;background:var(--cream);color:var(--ink);border-radius:999px;min-width:30px;height:30px;padding:0 9px;cursor:pointer;font-size:13px}
.addgal{border:1px dashed var(--ink);background:transparent;border-radius:4px;padding:18px;cursor:pointer;font-size:14px;width:100%}
.addgal:hover{background:var(--paper)}
#lb{position:fixed;inset:0;z-index:40;background:rgba(17,16,16,.92);display:grid;place-items:center;
  padding-block:calc(56px + env(safe-area-inset-top,0px)) calc(56px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#lb img{max-width:100%;max-height:100%;object-fit:contain}
#lb .close{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));color:var(--cream);border-color:var(--cream)}
#lb .lbnav{position:absolute;bottom:calc(12px + env(safe-area-inset-bottom,0px));left:0;right:0;display:flex;justify-content:center;gap:10px;color:var(--cream);align-items:center;font-size:13px;font-variant-numeric:tabular-nums}
#lb .lbnav button{border:1px solid var(--cream);background:transparent;color:var(--cream);border-radius:999px;height:36px;min-width:44px;cursor:pointer}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;background:var(--ink);border:1px solid var(--ink);margin:0}
.facts div{background:var(--cream);padding:12px 14px;min-width:0}
.facts dt{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--grey)}
.facts dd{margin:4px 0 0;font-size:14px}
.body a,.facts a{color:inherit;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
.body a:hover,.facts a:hover,.body a:focus-visible,.facts a:focus-visible{color:var(--burgundy)}
.facts .fe{position:relative;padding-right:34px}
.factdel{position:absolute;top:8px;right:8px;width:24px;height:24px;border-radius:50%;border:1px solid var(--line);background:var(--paper);cursor:pointer;line-height:1;font-size:14px}
.factdel:hover{background:var(--burgundy);color:var(--cream);border-color:var(--burgundy)}
.next{align-self:flex-start;border:0;background:var(--ink);color:var(--cream);border-radius:999px;padding:12px 20px;cursor:pointer;font-size:14px}
.next:hover{background:var(--burgundy)}
.spec{border-top:1px solid var(--ink);padding-top:18px;display:grid;gap:10px}
.spec .glyphs{font-size:clamp(76px,17vw,136px);line-height:.85}
.spec.h .glyphs,.spec.h .abc{font-family:var(--head);font-weight:700}
.spec.t .glyphs,.spec.t .abc{font-weight:200}
.spec.n .glyphs{font-family:var(--num);color:var(--burgundy);font-size:clamp(56px,13vw,104px)}
.abc{font-size:21px;word-break:break-all}
.weights{display:flex;gap:18px;flex-wrap:wrap;font-size:20px}
.pair{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--ink);border:1px solid var(--ink)}
.pair div{background:var(--paper);padding:16px}
.pair h5{margin:0 0 6px;font-size:24px}
.pair p{margin:0;font-size:14px}
.sw{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--ink);border:1px solid var(--ink)}
.sw span{aspect-ratio:3/2;display:flex;align-items:flex-end;padding:8px;font-size:11px;letter-spacing:.1em;text-transform:uppercase}

/* edit mode */
#editbar{position:fixed;z-index:30;left:50%;transform:translateX(-50%);top:calc(64px + env(safe-area-inset-top,0px));width:min(720px,calc(100% - 32px));
  background:var(--ink);color:var(--cream);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;box-shadow:0 20px 40px -20px rgba(0,0,0,.5)}
#editbar[hidden],[hidden]{display:none!important}
#editbar .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
#editbar label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.7}
#editbar input[type=text]{flex:1 1 140px;min-width:0;background:transparent;border:1px solid rgba(243,237,225,.3);border-radius:8px;color:var(--cream);padding:6px 9px;font:inherit;font-size:13px}
.eb{border:1px solid rgba(243,237,225,.4);background:transparent;color:var(--cream);border-radius:999px;padding:6px 13px;font-size:13px;cursor:pointer}
.eb.primary{background:var(--cream);color:var(--ink)}
.eb.primary:disabled{opacity:.45;cursor:default}
.tool{border:0;background:var(--cream);color:var(--ink);border-radius:999px;padding:7px 13px;font-size:13px;cursor:pointer}
#status{font-size:12px;opacity:.8;margin-left:auto}
body.editing [data-k]{outline:1px dashed rgba(122,21,48,.55);outline-offset:3px;border-radius:2px;cursor:text}
body.editing [data-k]:focus{outline:2px solid var(--burgundy);background:var(--paper)}
.rawbody{white-space:pre-wrap;font-size:16px;max-width:60ch;min-height:3em}
.edit-note{font-size:12px;color:var(--grey);margin:-8px 0 0}
/* landing: old television, zoom into the screen to reach the dial */
#intro{position:fixed;inset:0;z-index:10;background:var(--cream);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(18px,4vh,36px);
  overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tvstage{padding-top:clamp(54px,11vw,104px)}
.tv{position:relative;width:min(640px,88vw,calc((100vh - 220px) * 1.45));will-change:transform}
.ant{position:absolute;left:50%;top:0;width:18%;aspect-ratio:2/1;transform:translate(-50%,-92%)}
.ant::after{content:"";position:absolute;inset:0;background:var(--ink);border-radius:999px 999px 0 0}
.ant span{position:absolute;left:50%;bottom:40%;width:3px;height:clamp(54px,12vw,104px);background:var(--ink);transform-origin:bottom center;border-radius:2px}
.ant span:first-child{transform:translateX(-50%) rotate(-32deg)}
.ant span:last-child{transform:translateX(-50%) rotate(26deg)}
.ant span::before{content:"";position:absolute;top:-5px;left:50%;width:9px;height:9px;border-radius:50%;background:var(--ink);transform:translateX(-50%)}
.cab{position:relative;background:var(--ink);border-radius:5% / 7%;padding:4.4%;display:grid;grid-template-columns:1fr 23%;gap:4%;
  box-shadow:inset 0 0 0 2px #2c2a28,0 30px 50px -30px rgba(0,0,0,.6)}
.bezel{background:#2c2a28;border-radius:9% / 12%;padding:5.5%}
.screen{position:relative;container-type:size;aspect-ratio:4/3;border-radius:12% / 16%;overflow:hidden;background:#000;cursor:zoom-in}
.screen video,.screen img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.18) brightness(1.06)}
.scan{position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.32) 0 1px,transparent 1px 3px);pointer-events:none}
.glass{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(115% 95% at 50% 50%,transparent 52%,rgba(0,0,0,.7) 100%),linear-gradient(155deg,rgba(255,255,255,.22),transparent 38%);animation:flick 4s steps(1) infinite}
@keyframes flick{0%,100%{opacity:1}47%{opacity:.86}48%{opacity:1}82%{opacity:.92}}
.panel{display:flex;flex-direction:column;align-items:center;gap:9%;padding-block:4% 2%}
.knob{width:64%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 36% 30%,#5d5a56,#161514 68%);box-shadow:0 0 0 2px #3a3835;position:relative}
.knob::after{content:"";position:absolute;left:50%;top:8%;width:8%;height:30%;background:var(--cream);border-radius:2px;transform:translateX(-50%)}
.knob.small{width:42%}
.knob.small::after{transform:translateX(-50%) rotate(0deg);transform-origin:50% 140%}
.grill{width:68%;flex:1;min-height:24px;border-radius:3px;background:repeating-linear-gradient(0deg,#3d3a37 0 2px,transparent 2px 6px)}
.brand{font-family:var(--head);font-weight:700;color:var(--cream);font-size:clamp(11px,1.9vw,17px);letter-spacing:.04em}
.legs{display:flex;justify-content:space-between;padding:0 16%}
.legs span{width:2.6%;height:clamp(16px,4vw,34px);background:var(--ink);border-radius:0 0 3px 3px}
.legs span:first-child{transform:skewX(14deg)}
.legs span:last-child{transform:skewX(-14deg)}
.intro-name{margin:clamp(16px,4vh,40px) 0 0;text-align:center;max-width:100%;
  font-family:var(--name);font-weight:500;font-size:clamp(22px,3.2vw,32px);line-height:1.1;letter-spacing:.36em;padding-left:.36em;color:var(--ink)}
/* y2k word on the screen, in sage */
.tvword{position:absolute;inset:0;display:flex;align-items:flex-end;padding-bottom:11cqh;justify-content:center;gap:.3em;pointer-events:none;z-index:2;-webkit-mask-image:repeating-linear-gradient(0deg,#000 0 2px,rgba(0,0,0,.5) 2px 3px);mask-image:repeating-linear-gradient(0deg,#000 0 2px,rgba(0,0,0,.5) 2px 3px);font-size:9.6cqw;animation:wobble 1.1s steps(1) infinite}
.tvword span{font-family:"Michroma","Arial Black",sans-serif;font-size:1em;letter-spacing:.02em;line-height:1;position:relative;
  background:linear-gradient(180deg,#F4FAF1 0%,#CFE0C9 30%,var(--sage) 52%,#6E8C6A 72%,#D9E8D3 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  -webkit-text-stroke:.05em #1F3320;paint-order:stroke fill;filter:drop-shadow(0 0 .06em #F4FAF1) drop-shadow(0 0 .35em rgba(163,190,158,.95)) drop-shadow(.05em .07em 0 #1F3320)}
.tvword i{font-style:normal;font-size:.8em;color:#DCEBD6;text-shadow:0 0 .2em var(--sage),0 0 .5em var(--sage);animation:twinkle 2.4s ease-in-out infinite}
.tvword i:last-child{animation-delay:1.2s;align-self:flex-start;margin-top:.2em}
.tvword i:first-child{align-self:flex-end;margin-bottom:.2em}

.tvword span::before,.tvword span::after{content:attr(data-t);position:absolute;inset:0;background:none;-webkit-text-stroke:0;filter:none;pointer-events:none}
.tvword span::before{-webkit-text-fill-color:rgba(214,234,208,.75);transform:translateX(-.05em);animation:slice 1.4s steps(1) infinite}
.tvword span::after{-webkit-text-fill-color:rgba(46,72,44,.7);transform:translateX(.05em);animation:slice 1.9s steps(1) infinite reverse}
@keyframes slice{0%{clip-path:inset(10% 0 72% 0)}20%{clip-path:inset(62% 0 14% 0)}40%{clip-path:inset(36% 0 46% 0)}60%{clip-path:inset(82% 0 3% 0)}80%{clip-path:inset(4% 0 88% 0)}100%{clip-path:inset(48% 0 30% 0)}}
@keyframes wobble{0%{transform:translate(0,0)}12%{transform:translate(-.6%,.4%)}24%{transform:translate(.5%,-.3%) skewX(-3deg)}27%{transform:none}50%{transform:translate(.3%,.5%)}68%{transform:translate(-.4%,0);opacity:.85}71%{transform:translate(1.4%,0) skewX(7deg)}74%{transform:none;opacity:1}90%{transform:translate(0,-.4%)}}
@keyframes twinkle{0%,100%{opacity:1;transform:scale(1) rotate(0)}50%{opacity:.35;transform:scale(.7) rotate(25deg)}}
body.on-tv .bottom{visibility:hidden}
body.on-tv #tvBtn{display:none}
#wrap{transform-origin:50% 50%}
@media (max-width:560px){.pair{grid-template-columns:1fr}.hint{display:none}.bottom{flex-direction:column-reverse;align-items:stretch}}
@media (prefers-reduced-motion:reduce){#sheet,#scrim,.seg .hl{transition:none}.glass,.tvword,.tvword i,.tvword span::before,.tvword span::after{animation:none}}
</style>
</head>
<body>
<div id="app">
<div id="wrap"><button class="centre" id="centre" data-open="about"><span class="ab">ABOUT</span><span class="me">ME</span></button><canvas id="ink" aria-hidden="true"></canvas><div id="inkpad" hidden=""></div><div id="stage3d" role="group" aria-label="Film reel. Scroll or drag to turn, select a frame to open it."><div class="scene" id="scene"><div id="reel"></div></div></div></div>

<section id="intro" aria-label="Portfolio intro. Scroll, pinch or click the screen to enter.">
  <div class="tvstage">
    <div class="tv" id="tv">
      <div class="ant" aria-hidden="true"><span></span><span></span></div>
      <div class="cab">
        <div class="bezel"><div class="screen" id="screen"><video id="tvVideo" muted="" loop="" playsinline="" preload="auto" aria-label="video of emelie"></video><div class="tvword" id="tvWord" aria-hidden="true"><i>✦</i><span data-t="portfolio">portfolio</span><i>✧</i></div><div class="scan"></div><div class="glass"></div></div></div>
        <div class="panel" aria-hidden="true"><div class="knob"></div><div class="knob small"></div><div class="grill"></div><span class="brand">e.e.</span></div>
      </div>
      <div class="legs" aria-hidden="true"><span></span><span></span></div>
    </div>
  </div>
  <p class="intro-name" id="introCap">EMELIE EISELE</p>
</section>

<div class="top">
  <button class="logo" id="home" aria-label="Back to start">emelie eisele</button>
  <nav class="nav" aria-label="Sections">
    <button class="pill" id="tvBtn">tv</button>
    <button class="pill" data-open="outside" id="gtkBtn">get to know me better</button>
    <button class="pill" id="editBtn" aria-pressed="false" hidden="">edit</button>
  </nav>
</div>
<div class="bottom">
  <div class="left">
    <span class="hint">scroll or drag to turn the reel · click a frame to open</span>

    <label for="ringIn">ring text</label><input type="text" id="ringIn">

    <label for="mailIn">email</label><input type="text" id="mailIn">
  </div>
  <div class="row">
    <label for="seg1">reel labels</label>
    <input type="text" id="seg1" data-seg="about" aria-label="label about" hidden=""><input type="text" id="seg3" data-seg="outside" aria-label="label me outside">
    <input type="text" id="seg5" data-seg="fonts" aria-label="label fonts"><input type="text" id="seg7" data-seg="contact" aria-label="label contact">
  </div>
  <div class="row">
    <button class="eb" id="centerImg" hidden="">centre image</button>
    <button class="eb" id="drawBtn">✎ draw</button>
    <button class="eb" id="tvVidBtn">replace tv video</button>
    <button class="eb" id="fontBtn">replace clash display</button>
    <input type="file" id="fileIn" hidden="">
    <span style="flex:1"></span>
    <button class="eb" id="doneBtn">close editor</button>
    <button class="eb primary" id="saveBtn" disabled="">save</button>

</div>

<div id="drawbar" hidden="" role="toolbar" aria-label="Drawing tools">
  <span class="dlabel">oil pastel · sage</span>

<script type="application/json" id="state">{"font":"","clash":"","email":"eiseleemelie@gmail.com","tv":"assets/f224165dcc.mp4","tvPoster":"assets/c260d139d0.jpg","ring":"emelie eisele · portfolio · advertising & market communications · good ideas, strong visuals, stories that stick · ","images":{"slide2":"assets/4d7e4e2d19.png","p1":"assets/2bca09cbc3.png","p2":"assets/a8ebacfffa.jpg","p3":"assets/d32acaba3e.jpg","p4":"assets/b284b9295f.jpg","aboutPhoto":"assets/4ae885e1b8.jpg","outsidePhoto":"assets/79c76aede2.jpg"},"gallery":{"p1":["assets/dafe10b0ea.jpg","assets/dd96de6180.jpg"],"p2":["assets/7f38cf8536.jpg"],"p3":["assets/080a703200.png","assets/914b4f1c90.png"],"p4":[{"u":"assets/8ccbed7c76.mp4","v":1},{"u":"assets/c1e9c3c172.mp4","v":1}]},"segs":{"about":"about me","outside":"get to know me better","fonts":"Typography & Colour","contact":"say hi"},"about":{"title":"hi, i´m emelie","sub":"","body":"i study advertising and market communications and love turning ideas into something people can see, feel and connect with.\n\ninspired by nature, sports, the people around me and the little details that make a big difference.\n alongside my studies, i contribute to the [focus bikes website](https://www.focus-bikes.com), creating digital content, writing copy and working on newsletters.\n\nthis portfolio features a selection of university projects.","facts":[["studies","advertising & market communications"],["MAIL","eiseleemelie@gmail.com"],["PHONE","+4917662403768"]]},"projects":{"p1":{"n":"01","short":"calvin klein","title":"calvin klein","sub":"a feeling you´ll never take off","body":"a university campaign for calvin klein swimwear.\n\nfor a summer that never ends and a feeling that stays. The campaign tells this story emotionally and visually through tan lines: the mark summer leaves on your skin long after the swimsuit is gone.","facts":[["context","university project"],["brand","calvin klein swimwear"],["idea","a feeling you'll never take off."]]},"p2":{"n":"02","short":"marilyn","title":"the secret life of marilyn","sub":"an ooh campaign for a fictional exhibition","body":"an out-of-home campaign for a fictional marilyn monroe exhibition at museum frieder burda.","facts":[["context","university project"],["format","out of home"],["venue","museum frieder burda"]]},"p3":{"n":"03","short":"cyclo","title":"cyclo","sub":"from a strategy project to a real product","body":"cycling is booming, and more and more women are taking up the sport. Whilst men can cycle without a care at any time of the month, women have to put more thought into planning during their period.\nAs, for hygiene reasons and to avoid chafing, no underwear is worn under cycling bibs, period underwear cannot be worn either. Even traditional sanitary products such as tampons or pads quickly reach their limits on longer rides. They need to be changed hygienically whilst out and about, generate waste that is difficult to dispose of in the countryside, and pose health risks if worn for too long.\nSo my team and I developed a period-friendly cycling bib to support women in a male-dominated field.","facts":[["context","university project, start-up idea"],["result","won the so-called lions´ cage"],["product","period-friendly cycling bib"]]},"p4":{"n":"04","short":"telekom","title":"telekom","sub":"gegen hass im netz · free the web from hate","body":"the task was to build a creative idea for telekom´s initiative “gegen hass im netz”, in cooperation with jung von matt.\n\nfree the web from hate.","facts":[["context","university project"],["client","telekom"],["partner","jung von matt"],["theme","gegen hass im netz"]]}},"outside":{"title":"get to know me better","body":"i've never really struggled to find joy in life. i find it in the little things, in everyday moments. in being outdoors, in moving, in long conversations with the people i love. i like trying new things, exploring new places and keeping things moving. staying in one place for too long has never really been my thing.\nso when i finished school, i found it hard to imagine doing just one thing for the rest of my life.\ni chose a degree that didn't quite feel right. started a job that didn't really fulfil me. but deep down, i knew there had to be something that felt more like me.\nso i took a step back, thought about what i really wanted and decided to start all over again. i wanted something that had room for ideas, new perspectives and the chance to bring things to life.\nso i started a new bachelor's degree in advertising and market communication. looking back, it was one of the best decisions i've ever made.\ntoday, i work on creative projects at university and i'm part of the team at [focus bikes](https://www.focus-bikes.com), surrounded by people who share my passion for movement. it's where the things i love and the things i want to do finally come together.\nmost of my ideas don't come to me at a desk. they come on the bike, on long rides and sometimes during ultra cycling races, when there are hours of road ahead and nothing to do but think. they come from the people around me, from their stories and the way they see the world. and they often come from the small things, the ones that don't seem important at first: a detail by the roadside, a passing remark, a habit nobody questions. that's usually where something interesting is hiding.\nriding has also taught me something beyond the finish line. on every long ride there are moments when i question why i'm doing this, when everything hurts and giving up seems easier. but then i remind myself: if it were easy, everyone would do it. so i keep going.\nit's taught me to trust myself, to embrace challenges and to know that i can figure things out along the way.\nthere are still so many things i haven't tried, places i haven't seen and ideas i haven't brought to life.\nand that's the exciting part."},"drawings":[{"s":386659832,"w":2.2,"pts":[[-100.36,-12.67,0.08],[-100.36,-12.67,0.08],[-100.36,-12.67,0.08],[-100.36,-1 /* ---------- landing: zoom into the television ---------- */
const intro=$('intro'),tv=$('tv'),screenEl=$('screen'),vid=$('tvVideo'),cap=$('introCap'),wrapEl=$('wrap');
let z=0,zt=0,zraf=0,entered=false,geo=null,snapTimer=0;
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
function setVideo(){vid.src=S.tv||'';if(S.tvPoster)vid.poster=S.tvPoster;else vid.removeAttribute('poster');
  if(!reduce&&!entered)vid.play?.().catch(()=>{})}
function measureTV(){const prev=tv.style.transform;tv.style.transform='none';
  const t=tv.getBoundingClientRect(),s=screenEl.getBoundingClientRect();tv.style.transform=prev;
  geo={ox:s.left+s.width/2-t.left,oy:s.top+s.height/2-t.top,tx:innerWidth/2-(s.left+s.width/2),ty:innerHeight/2-(s.top+s.height/2),
    S:Math.max(innerWidth/s.width,innerHeight/s.height)*1.12}}
function renderZoom(){if(!geo)measureTV();
  const s=Math.pow(geo.S,z),f=(s-1)/(geo.S-1);
  tv.style.transformOrigin=`${geo.ox}px ${geo.oy}px`;
  tv.style.transform=z>0?`translate(${geo.tx*f}px,${geo.ty*f}px) scale(${s})`:'';
  cap.style.opacity=1-clamp(z*4);$('tvWord').style.opacity=1-clamp((z-.45)/.3);
  intro.style.opacity=1-clamp((z-.86)/.14);
  const d=clamp((z-.78)/.22);wrapEl.style.opacity=d;
  if(d>0&&!landed){landed=true;aimSayHi()}
  if(z<.5&&landed&&!pulling){landed=false}
  if(!pulling)svg.style.transform=reduce?'':`scale(${ZS})`;
  const inside=z>=.999;
  if(inside!==entered){entered=inside;intro.style.pointerEvents=inside?'none':'';intro.setAttribute('aria-hidden',String(inside));
    wrapEl.style.pointerEvents=inside?'':'none';document.body.classList.toggle('on-tv',!inside);
    if(inside){vid.pause();svg.focus?.({preventScroll:true});pullBack()}else if(!reduce)vid.play?.().catch(()=>{})}}
function zframe(){z+=(zt-z)*.11;if(Math.abs(zt-z)<.0015){z=zt;renderZoom();zraf=0;return}renderZoom();zraf=requestAnimationFrame(zframe)}
function zoomTo(t,instant){zt=clamp(t);if(instant||reduce){z=zt;renderZoom();return}if(!zraf)zraf=requestAnimationFrame(zframe)}
function settle(){clearTimeout(snapTimer);snapTimer=setTimeout(()=>zoomTo(zt>.42?1:0),260)}
function zoomWheel(e){const d=Math.abs(e.deltaY)>Math.abs(e.deltaX)?e.deltaY:e.deltaX;zoomTo(zt+d*(e.ctrlKey?.01:.0016));settle()}
const pts=new Map();let gesture=null;
intro.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;pts.set(e.pointerId,{x:e.clientX,y:e.clientY});intro.setPointerCapture(e.pointerId);
  gesture={z0:zt,y0:e.clientY,dist:pts.size===2?dist():0,moved:0,target:e.target}});
intro.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId)||!gesture)return;pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pts.size===2){const d=dist();if(!gesture.dist){gesture.dist=d;gesture.z0=zt}zoomTo(gesture.z0+Math.log(d/gesture.dist)*.9)}
  else{const dy=gesture.y0-e.clientY;gesture.moved=Math.max(gesture.moved,Math.abs(dy));zoomTo(gesture.z0+dy/(innerHeight*.55))}});
function endPtr(e){if(!pts.has(e.pointerId))return;pts.delete(e.pointerId);if(pts.size)return;
  if(gesture&&gesture.moved<6&&gesture.target.closest?.('#screen'))zoomTo(1);else settle();gesture=null}
intro.addEventListener('pointerup',endPtr);intro.addEventListener('pointercancel',endPtr);
function dist(){const [a,b]=[...pts.values()];return Math.hypot(a.x-b.x,a.y-b.y)}
$('tvBtn').onclick=()=>{close();setDrawing(false);if(editing)setEditing(false);zoomTo(0)};

/* ---------- arrival: come out of the tv close up on "say hi", then pull back ---------- */
const ZS=2.2;let landed=false,pulling=false;
function aimSayHi(){const k=SEG.findIndex(x=>x.id==='contact');if(k<0)return;
  rot=-k*STEP;vel=0;snapTo=null;apply();touch();
  const prev=svg.style.transform;svg.style.transform='none';
  const r=frames[k].getBoundingClientRect();svg.style.transform=prev;
  svg.style.transformOrigin=`${r.left+r.width/2}px ${r.top+r.height/2}px`}
function pullBack(){if(reduce){svg.style.transform='';return}
  pulling=true;const t0=performance.now(),D=2900;
  const step=now=>{const t=Math.min(1,(now-t0)/D),e=-(Math.cos(Math.PI*t)-1)/2;
    svg.style.transform=`scale(${ZS+(1-ZS)*e})`;touch();
    if(t<1)requestAnimationFrame(step);else{svg.style.transform='';pulling=false}};
  requestAnimationFrame(step)}

/* ---------- oil pastel handwriting (sage), anchored to the big ME ---------- */
S.drawings=S.drawings||[];
const ink=$('ink'),pad=$('inkpad'),ictx=ink.getContext('2d');
const SAGE=['#A3BE9E','#A3BE9E','#A3BE9E','#8EAD88','#8EAD88','#C6DAC0'];
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function meBox(){const el=document.querySelector('#centre .me');const r=el.getBoundingClientRect();return{cx:r.left+r.width/2,cy:r.top+r.height/2,u:parseFloat(getComputedStyle(el).fontSize)/100}}
function stamp(x,y,r,rng){
  /* body: soft dab that builds up to a dense, slightly uneven colour */
  ictx.globalAlpha=.16+rng()*.1;ictx.fillStyle=SAGE[0];ictx.beginPath();ictx.arc(x+(rng()-.5)*r*.15,y+(rng()-.5)*r*.15,r*(.82+rng()*.12),0,6.2832);ictx.fill();
  /* grain: fine specks of lighter and darker pigment, denser at the edges like waxy pastel */
  for(let k=0;k<9;k++){const a=rng()*6.2832,d=(.35+.65*Math.sqrt(rng()))*r,rr=r*(.04+rng()*.09);
    ictx.globalAlpha=.25+rng()*.5;ictx.fillStyle=SAGE[(rng()*SAGE.length)|0];ictx.beginPath();ictx.arc(x+Math.cos(a)*d,y+Math.sin(a)*d,rr,0,6.2832);ictx.fill()}
  /* paper showing through: tiny gaps */
  if(rng()<.5){ictx.globalCompositeOperation='destination-out';ictx.globalAlpha=.5;ictx.beginPath();ictx.arc(x+(rng()-.5)*r*1.4,y+(rng()-.5)*r*1.4,r*(.05+rng()*.07),0,6.2832);ictx.fill();ictx.globalCompositeOperation='source-over'}}
function seg(st,i,box,rng){const a=st.pts[i-1],b=st.pts[i];const ax=box.cx+a[0]*box.u,ay=box.cy+a[1]*box.u,bx=box.cx+b[0]*box.u,by=box.cy+b[1]*box.u;
  const ra=st.w*box.u*(.55+a[2]*.9),rb=st.w*box.u*(.55+b[2]*.9);const dist=Math.hypot(bx-ax,by-ay),n=Math.max(1,Math.ceil(dist/(Math.min(ra,rb)*.22)));
  for(let j=1;j<=n;j++){const t=j/n;stamp(ax+(bx-ax)*t,ay+(by-ay)*t,ra+(rb-ra)*t,rng)}}
function renderInk(){const dpr=Math.min(devicePixelRatio||1,2),W=innerWidth,H=innerHeight;
  if(ink.width!==Math.round(W*dpr)||ink.height!==Math.round(H*dpr)){ink.width=Math.round(W*dpr);ink.height=Math.round(H*dpr)}
  ictx.setTransform(dpr,0,0,dpr,0,0);ictx.clearRect(0,0,W,H);const box=meBox();
  for(const st of S.drawings){const rng=mulberry(st.s);if(st.pts.length===1){const p=st.pts[0];stamp(box.cx+p[0]*box.u,box.cy+p[1]*box.u,st.w*box.u*(.55+p[2]*.9),rng)}for(let i=1;i<st.pts.length;i++)seg(st,i,box,rng)}
  ictx.globalAlpha=1}
let cur=null,curRng=null,curBox=null,penSeen=false,brush=3.6;
function addPt(e){const p=e.pointerType==='mouse'?.5:(e.pressure>0?e.pressure:.5);
  cur.pts.push([+((e.clientX-curBox.cx)/curBox.u).toFixed(2),+((e.clientY-curBox.cy)/curBox.u).toFixed(2),+p.toFixed(2)]);
  const i=cur.pts.length-1;if(i>0)seg(cur,i,curBox,curRng);else stamp(e.clientX,e.clientY,cur.w*curBox.u*(.55+p*.9),curRng);ictx.globalAlpha=1}
pad.addEventListener('pointerdown',e=>{if(e.pointerType==='pen')penSeen=true;if(penSeen&&e.pointerType==='touch')return;e.preventDefault();
  pad.setPointerCapture(e.pointerId);curBox=meBox();cur={s:(Math.random()*1e9)|0,w:brush,pts:[]};curRng=mulberry(cur.s);addPt(e)});
pad.addEventListener('pointermove',e=>{if(!cur)return;const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];for(const ev of (evs.length?evs:[e]))addPt(ev)});
function endStroke(){if(!cur)return;S.drawings.push(cur);cur=null;dirty();status('stroke added. press save to keep your drawing.')}
pad.addEventListener('pointerup',endStroke);pad.addEventListener('pointercancel',endStroke);
function setDrawing(on){document.body.classList.toggle('drawing',on);pad.hidden=!on;$('drawbar').hidden=!on;if(on){close();renderInk()}}
$('drawBtn').onclick=()=>{if(!entered)zoomTo(1,true);setDrawing(true)};
$('doneInk').onclick=()=>{setDrawing(false);status(isDirty?'press save to keep your drawing.':'')};
document.querySelectorAll('.dsize').forEach(b=>b.onclick=()=>{brush=+b.dataset.size;document.querySelectorAll('.dsize').forEach(x=>x.classList.toggle('on',x===b))});
$('undoInk').onclick=()=>{if(S.drawings.length){S.drawings.pop();renderInk();dirty()}};
let clearArm=0;$('clearInk').onclick=e=>{const b=e.currentTarget;if(Date.now()-clearArm<2500){S.drawings=[];renderInk();dirty();b.textContent='clear';clearArm=0}else{clearArm=Date.now();b.textContent='tap again';setTimeout(()=>b.textContent='clear',2500)}};
addEventListener('resize',()=>renderInk());

/* ---------- boot ---------- */
applyFont();size();addEventListener('resize',size);buildDial();renderMail();
setVideo();wrapEl.style.opacity=0;wrapEl.style.pointerEvents='none';document.body.classList.add('on-tv');
if(reduce)vid.pause();
requestAnimationFrame(()=>{geo=null;renderZoom()});
document.fonts?.ready.then(()=>{geo=null;renderZoom();renderInk()});
requestAnimationFrame(()=>renderInk());
(async()=>{try{
  artifactNS=await window.claude?.use?.('artifact');
  if(!artifactNS)return;
  const user=await window.claude.use('user');
  if(user&&!(await user.canEdit()))return;
  assetsNS=await window.claude.use('assets');
  $('editBtn').hidden=false;
}catch{}})();
})();
</script>
</body>
